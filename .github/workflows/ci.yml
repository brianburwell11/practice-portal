name: CI

# Every push and PR: install exactly what the lockfile pins, refuse a
# high-severity advisory in anything that ships, build the SPA and the
# server the way the Dockerfile does, and run the unit tests.

on:
  push:
    branches: [main, development]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # vendor/muse-encore (the sheet music engine) is a submodule; the
          # build compiles it. Not recursive: its own MuseScore submodule
          # (reference sources) isn't needed.
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit shipped dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npm test
      - run: npm run build:server
