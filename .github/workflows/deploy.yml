name: GitHub Pages redirect

# Practice Portal runs on Fly at https://practiceportal.app. The old GitHub
# Pages copy is retired: this publishes a page that sends every address on
# brianburwell11.github.io/practice-portal to the same address there, and
# keep_files: false wipes everything the old builds left behind.

on:
  push:
    branches: [main]
    paths: [gh-pages-redirect/**, .github/workflows/deploy.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 404.html answers every path that isn't index.html, so deep links redirect too.
      - run: |
          mkdir -p out
          cp gh-pages-redirect/index.html out/index.html
          cp gh-pages-redirect/index.html out/404.html
          touch out/.nojekyll

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          keep_files: false
