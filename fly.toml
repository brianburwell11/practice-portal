# Fly.io config for the read-only server (Phase 3).
#
#   fly launch --no-deploy --copy-config   # first time: claims the app name
#   fly deploy
#   npm run smoke:server -- --url https://<app>.fly.dev
#
# Secrets (fly secrets import/set): DATABASE_URL, GOOGLE_CLIENT_ID,
# GOOGLE_CLIENT_SECRET, R2_ENDPOINT, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY,
# R2_BUCKET, ADMIN_EMAILS.

app = "practice-portal"
# Next to the us-east-2 Neon project — see the plan's "Where it runs".
primary_region = "ord"
kill_signal = "SIGTERM"
kill_timeout = "10s"

[build]
  [build.args]
    # Public bucket URL, baked into the SPA bundle at build time.
    VITE_R2_PUBLIC_URL = "https://pub-9e583788dafa4ce193a3eee1987d93b6.r2.dev"

[env]
  # The one public address. practice-portal.fly.dev and www get a 308 to it
  # (server/main.ts) — one address, one sign-in.
  CANONICAL_HOST = "practiceportal.app"
  # Rebuilds media URLs (logos, audioBasePath) inside /api/data documents.
  R2_PUBLIC_URL = "https://pub-9e583788dafa4ce193a3eee1987d93b6.r2.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  # 1 GB since the server writes: a multi-stem transcode, or MuseScore under
  # xvfb, is tight in 512 MB. Still stops when idle.
  memory = "1gb"
